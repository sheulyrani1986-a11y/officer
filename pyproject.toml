[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "officer"
version = "0.1.0"
description = "OfficeR - A modern, beginner-friendly, Linux-native office suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "odfpy>=1.4.0",
    "Pillow>=10.0.0",
]

[project.scripts]
officer = "officer.app:main"
officer-writer = "officer.writer.app:main"
officer-rsheet = "officer.rsheet.app:main"
officer-presentr = "officer.presentr.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
